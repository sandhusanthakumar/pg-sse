[project]
name = "pg-sse"
# One place: `__version__` in src/pg_sse/__init__.py; hatchling reads it at build time.
dynamic = ["version"]
description = "Live updates from the Postgres you already run: LISTEN/NOTIFY wake-ups, re-reads from a cursor, served as server-sent events from any async Python framework (Starlette and FastAPI built in)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Sandhu Santhakumar" }]
requires-python = ">=3.11"
dependencies = [
    "psycopg>=3.2.1",
]
keywords = ["postgres", "postgresql", "listen", "notify", "sse", "server-sent-events", "fastapi", "starlette", "realtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]

[project.optional-dependencies]
# Only `hub.sse` needs a framework; `hub.stream` works with any.
starlette = ["starlette>=0.36"]
fastapi = ["fastapi>=0.110"]

[project.urls]
Homepage = "https://github.com/sandhusanthakumar/pg-sse"
Issues = "https://github.com/sandhusanthakumar/pg-sse/issues"
Changelog = "https://github.com/sandhusanthakumar/pg-sse/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "fastapi>=0.110",
    "httpx>=0.27",
    "mypy>=1.10",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "starlette>=0.36",
    "uvicorn>=0.30",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/pg_sse/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE", "llms.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["pg_sse"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S608", "ASYNC109"]
