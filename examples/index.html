<!doctype html>
<meta charset="utf-8">
<title>pg-sse chat</title>
<style>
  body { font: 16px system-ui; max-width: 36rem; margin: 2rem auto; padding: 0 1rem; }
  #log { list-style: none; padding: 0; min-height: 10rem; }
  input { width: 75%; }
</style>
<h1>Lobby</h1>
<ul id="log"></ul>
<form id="form">
  <input id="body" placeholder="Say something" autocomplete="off" required>
  <button>Send</button>
</form>
<script>
  // EventSource reconnects by itself and resumes from the last id it saw.
  const source = new EventSource("/rooms/lobby/stream");
  source.onmessage = (e) => {
    const li = document.createElement("li");
    li.textContent = JSON.parse(e.data).body;
    document.getElementById("log").append(li);
  };
  document.getElementById("form").onsubmit = async (e) => {
    e.preventDefault();
    const input = document.getElementById("body");
    await fetch("/rooms/lobby/messages", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ body: input.value }),
    });
    input.value = "";
  };
</script>
